<text x="40" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#bdb7ad">GitHub in the terminal, like on the site: repos, PRs</text>
