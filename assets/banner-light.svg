<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
<defs>
  <radialGradient id="fade" cx="0.3" cy="0.5" r="0.8"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff"/></radialGradient>
  <radialGradient id="glow" cx="0.2" cy="0.5" r="0.5"><stop offset="0" stop-color="#00ADD8" stop-opacity="0.16"/><stop offset="1" stop-color="#00ADD8" stop-opacity="0"/></radialGradient>
  <linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#00ADD8" stop-opacity="0"/><stop offset="0.5" stop-color="#00ADD8" stop-opacity="0.10"/><stop offset="1" stop-color="#00ADD8" stop-opacity="0"/></linearGradient>
  <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="type"><rect x="84" y="186" height="34" width="245" class="typing"/></clipPath>
  <style>
    .t{font-family:"SF Pro Display",-apple-system,"Segoe UI",Inter,sans-serif}
    .m{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
    .scan{animation:scan 6s linear infinite} @keyframes scan{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}
    .typing{animation:type 2.4s steps(20) .4s backwards} @keyframes type{from{width:0}}
    .cur{animation:move 2.4s steps(20) .4s backwards, blink 1.1s steps(1) 2.8s infinite}
    @keyframes move{from{transform:translateX(-245px)}} @keyframes blink{50%{opacity:0}}
    .ecg{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 3.2s linear infinite} @keyframes draw{to{stroke-dashoffset:0}}
    .ok{animation:pulse 1.6s ease-in-out infinite} @keyframes pulse{50%{opacity:.35}}
    .live{animation:pulse 1.2s ease-in-out infinite}
  </style>
</defs>
